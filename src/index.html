<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini Game Mobile Legends - Lawan Super Spesial</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #222;
    color: #fff;
    margin: 0;
    overflow: hidden;
  }
  #gameArea {
    position: relative;
    width: 100vw;
    height: 100vh;
    background-color: #444;
  }
  .player, .enemy, .special-enemy, .super-special-enemy {
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    color: #fff;
  }
  #player {
    background-color: #4CAF50;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  .enemy {
    background-color: #f44336; /* Merah untuk lawan biasa */
  }
  .special-enemy {
    background-color: #FFA500; /* Oranye untuk lawan spesial */
  }
  .super-special-enemy {
    background-color: #000000; /* Hitam untuk lawan super spesial */
  }
  #points {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 20px;
  }
  #status {
    position: absolute;
    top: 40px;
    left: 10px;
    font-size: 18px;
  }
</style>
</head>
<body>

<div id="gameArea">
  <div id="player" class="player">you</div>
</div>
<div id="points">Points: 0</div>
<div id="status">Tekan 'F' untuk serang, 'WASD' untuk bergerak, 'P' lihat poin, 'R' restart</div>

<script>
const gameArea = document.getElementById('gameArea');
const player = document.getElementById('player');
const pointsDisplay = document.getElementById('points');
const status = document.getElementById('status');

// Load poin dari localStorage atau inisialisasi jika belum ada
let points = localStorage.getItem('points') ? parseInt(localStorage.getItem('points')) : 0;
let keysPressed = {}; // Objek untuk melacak tombol yang ditekan

// Posisi pemain
let playerPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
let enemies = []; // Array untuk menyimpan semua lawan (biasa, spesial, super spesial)

const NUM_NORMAL_ENEMIES = 30; // Jumlah lawan biasa
const SPECIAL_ENEMY_POINTS = 4500; // Poin dari lawan spesial oranye
const SUPER_SPECIAL_ENEMY_POINTS = 45000; // Poin dari lawan super spesial hitam

const ENEMY_SIZE = 40; // Ukuran semua lawan
const PLAYER_SPEED = 3; // Kecepatan pemain
const ENEMY_ATTACK_RANGE = 50; // Jarak serangan lawan
const ENEMY_ATTACK_INTERVAL = 1000; // Interval serangan lawan (ms)

// Fungsi untuk mendapatkan posisi acak di dalam game area
function getRandomPosition() {
  const x = Math.random() * (window.innerWidth - ENEMY_SIZE);
  const y = Math.random() * (window.innerHeight - ENEMY_SIZE);
  return { x, y };
}

// Fungsi untuk inisialisasi semua lawan
function initEnemies() {
  enemies = []; // Kosongkan array lawan
  // Hapus elemen lawan yang ada di DOM sebelum membuat yang baru
  document.querySelectorAll('.enemy, .special-enemy, .super-special-enemy').forEach(e => e.remove());

  // 1. Buat lawan biasa (merah)
  for (let i = 0; i < NUM_NORMAL_ENEMIES; i++) {
    const el = document.createElement('div');
    el.className = 'enemy';
    el.innerText = 'E' + (i + 1);
    gameArea.appendChild(el);
    const pos = getRandomPosition();
    el.style.left = pos.x + 'px';
    el.style.top = pos.y + 'px';
    enemies.push({ element: el, x: pos.x, y: pos.y, alive: true, isSpecial: false, isSuperSpecial: false });
  }

  // 2. Buat lawan spesial (oranye)
  const specialEl = document.createElement('div');
  specialEl.className = 'special-enemy';
  specialEl.innerText = 'SP'; // Label untuk lawan spesial
  gameArea.appendChild(specialEl);
  const specialPos = getRandomPosition();
  specialEl.style.left = specialPos.x + 'px';
  specialEl.style.top = specialPos.y + 'px';
  enemies.push({ element: specialEl, x: specialPos.x, y: specialPos.y, alive: true, isSpecial: true, isSuperSpecial: false });

  // 3. Buat lawan super spesial (hitam)
  const superSpecialEl = document.createElement('div');
  superSpecialEl.className = 'super-special-enemy';
  superSpecialEl.innerText = 'SS'; // Label untuk lawan super spesial
  gameArea.appendChild(superSpecialEl);
  const superSpecialPos = getRandomPosition();
  superSpecialEl.style.left = superSpecialPos.x + 'px';
  superSpecialEl.style.top = superSpecialPos.y + 'px';
  enemies.push({ element: superSpecialEl, x: superSpecialPos.x, y: superSpecialPos.y, alive: true, isSpecial: false, isSuperSpecial: true });
}

// Update posisi pemain di DOM
function updatePlayerPosition() {
  player.style.left = playerPos.x + 'px';
  player.style.top = playerPos.y + 'px';
}

// Inisialisasi game saat pertama kali dimuat
initEnemies();
updatePlayerPosition();
updatePointsDisplay();

// Update tampilan poin
function updatePointsDisplay() {
  pointsDisplay.innerText = 'Points: ' + points;
}

// Game loop untuk gerakan yang mulus
function gameLoop() {
  // Gerakan pemain berdasarkan tombol yang ditekan
  if (keysPressed['w']) playerPos.y -= PLAYER_SPEED;
  if (keysPressed['s']) playerPos.y += PLAYER_SPEED;
  if (keysPressed['a']) playerPos.x -= PLAYER_SPEED;
  if (keysPressed['d']) playerPos.x += PLAYER_SPEED;

  // Batasi posisi pemain agar tidak keluar layar
  if (playerPos.x < 0) playerPos.x = 0;
  if (playerPos.y < 0) playerPos.y = 0;
  if (playerPos.x > window.innerWidth - ENEMY_SIZE) playerPos.x = window.innerWidth - ENEMY_SIZE;
  if (playerPos.y > window.innerHeight - ENEMY_SIZE) playerPos.y = window.innerHeight - ENEMY_SIZE;

  updatePlayerPosition();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop); // Mulai game loop

// Event listener untuk tombol ditekan
document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  keysPressed[key] = true; // Tandai tombol ditekan
  if (key === 'f') {
    attack();
  } else if (key === 'p') {
    alert('Poin kamu: ' + points);
  } else if (key === 'r') {
    restartGame();
  }
});

// Event listener untuk tombol dilepas
document.addEventListener('keyup', (e) => {
  keysPressed[e.key.toLowerCase()] = false; // Tandai tombol dilepas
});

// Fungsi untuk menyerang lawan
function attack() {
  enemies.forEach(e => {
    if (e.alive && isNear(playerPos, e)) {
      e.alive = false;
      e.element.style.display = 'none'; // Sembunyikan lawan yang dikalahkan

      let pointsGained = 1; // Poin default untuk lawan biasa
      let message = 'Kamu mengalahkan lawan.';

      if (e.isSuperSpecial) {
        pointsGained = SUPER_SPECIAL_ENEMY_POINTS;
        message = 'Kamu mengalahkan LAWAN SUPER SPESIAL!!!';
      } else if (e.isSpecial) {
        pointsGained = SPECIAL_ENEMY_POINTS;
        message = 'Kamu mengalahkan LAWAN SPESIAL!';
      }

      points += pointsGained;
      localStorage.setItem('points', points); // Simpan poin ke localStorage
      updatePointsDisplay();
      status.innerText = message;

      // Beri jeda sebelum status berubah dan cek apakah ada lawan yang tersisa
      setTimeout(() => {
        const remainingEnemies = enemies.filter(en => en.alive);
        if (remainingEnemies.length > 0) {
          status.innerText = 'Lawan menyerang kamu!';
        } else {
          status.innerText = 'Semua lawan dikalahkan! Tekan R untuk restart.';
        }
      }, 500);
    }
  });
}

// Cek apakah pemain dekat dengan lawan
function isNear(pos1, enemy) {
  const dx = pos1.x - enemy.x;
  const dy = pos1.y - enemy.y;
  // Menggunakan Pythagoras untuk menghitung jarak
  return Math.sqrt(dx*dx + dy*dy) < ENEMY_ATTACK_RANGE;
}

// Interval untuk membuat lawan menyerang secara otomatis
setInterval(() => {
  enemies.forEach(e => {
    if (e.alive && isNear(playerPos, e)) {
      status.innerText = 'Kamu diserang oleh ' + e.element.innerText;
      // Di sini bisa ditambahkan logika pengurangan health pemain atau game over
    }
  });
}, ENEMY_ATTACK_INTERVAL);

// Fungsi untuk me-restart game
function restartGame() {
  // Reset posisi pemain ke tengah layar
  playerPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
  updatePlayerPosition();
  // Inisialisasi ulang semua lawan
  initEnemies();
  status.innerText = 'Game di-restart!';
}

// Handle resize window agar posisi pemain tetap proporsional
window.addEventListener('resize', () => {
  // Pastikan pemain tidak keluar dari batas baru layar
  if (playerPos.x > window.innerWidth - ENEMY_SIZE) playerPos.x = window.innerWidth - ENEMY_SIZE;
  if (playerPos.y > window.innerHeight - ENEMY_SIZE) playerPos.y = window.innerHeight - ENEMY_SIZE;
  updatePlayerPosition();
});
</script>

</body>
</html>
