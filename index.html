<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Game Mobile Legends (big Update)</title><meta name="title" content="Game Mobile Legends (big Update)"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Game Mobile Legends - Tombol Main</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #222;
    color: #fff;
    margin: 0;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  #gameArea {
    position: relative;
    width: 100vw;
    height: 100vh;
    background-color: #444;
    display: none; /* Sembunyikan area game secara default */
    z-index: 2; /* Pastikan game di atas elemen lain */
  }
  .player, .enemy, .special-enemy, .super-special-enemy {
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    color: #fff;
  }
  #player {
    background-color: #4CAF50;
  }
  .enemy {
    background-color: #f44336; /* Merah */
  }
  .special-enemy {
    background-color: #FFA500; /* Oranye */
  }
  .super-special-enemy {
    background-color: #000000; /* Hitam */
  }
  #points {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 20px;
    z-index: 10;
  }
  #status {
    position: absolute;
    top: 40px;
    left: 10px;
    font-size: 18px;
    z-index: 10;
  }

  /* Loading Screen Styles */
  #loadingScreen {
    position: absolute; /* Agar bisa ditumpuk di atas gameArea */
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #222; /* Sama dengan warna body */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100; /* Pastikan loading screen di paling atas */
    transition: opacity 0.5s ease-out; /* Transisi saat menghilang */
  }
  #progressBarContainer {
    width: 80%;
    max-width: 500px;
    height: 30px;
    background-color: #555;
    border-radius: 5px;
    margin: 20px auto;
    overflow: hidden;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    background-color: #4CAF50;
    border-radius: 5px;
    transition: width 0.1s linear;
  }
  #loadingText {
    font-size: 24px;
    font-weight: bold;
  }
  #playButton {
    padding: 15px 30px;
    font-size: 24px;
    font-weight: bold;
    background-color: #f44336; /* Warna merah untuk tombol play */
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 20px;
    opacity: 0; /* Sembunyikan tombol play secara default */
    transition: opacity 0.5s ease-in;
    z-index: 101; /* Di atas loading screen */
  }
  #playButton:hover {
    background-color: #d32f2f; /* Warna lebih gelap saat hover */
  }
</style>



<div id="loadingScreen">
  <div id="loadingText">Loading... 0%</div>
  <div id="progressBarContainer">
    <div id="progressBar"></div>
  </div>
  <button id="playButton">Main!!!</button>
</div>

<div id="gameArea">
  <div id="player" class="player">you</div>
  <div id="points">Points: 0</div>
  <div id="status">Tekan 'F' untuk serang, 'WASD' untuk bergerak, 'P' lihat poin, 'R' restart</div>
</div>

<script>
  const gameArea = document.getElementById('gameArea');
  const loadingScreen = document.getElementById('loadingScreen');
  const loadingText = document.getElementById('loadingText');
  const progressBar = document.getElementById('progressBar');
  const playButton = document.getElementById('playButton');

  const player = document.getElementById('player');
  const pointsDisplay = document.getElementById('points');
  const status = document.getElementById('status');

  // Konstanta game
  const NUM_NORMAL_ENEMIES = 30;
  const SPECIAL_ENEMY_POINTS = 4500;
  const SUPER_SPECIAL_ENEMY_POINTS = 45000;
  const ENEMY_SIZE = 40;
  const PLAYER_SPEED = 3;
  const ENEMY_ATTACK_RANGE = 50;
  const ENEMY_ATTACK_INTERVAL = 1000;
  const LOADING_DURATION = 2000; // Durasi loading dalam milidetik (2 detik)

  let points = localStorage.getItem('points') ? parseInt(localStorage.getItem('points')) : 0;
  let keysPressed = {};
  let enemies = [];
  let playerPos = { x: window.innerWidth/2, y: window.innerHeight/2 };

  // --- Fungsi Loading ---
  function updateLoading(percentage) {
    loadingText.innerText = `Loading... ${Math.round(percentage)}%`;
    progressBar.style.width = `${percentage}%`;
  }

  function showPlayButton() {
    playButton.style.opacity = '1'; // Tampilkan tombol play
    playButton.style.display = 'block'; // Pastikan tombol terlihat
  }

  function hideLoadingScreen() {
    loadingScreen.style.opacity = '0'; // Transisi menghilang
    loadingScreen.style.pointerEvents = 'none'; // Nonaktifkan interaksi saat menghilang
    gameArea.style.display = 'block'; // Tampilkan area game
  }

  function startLoading() {
    let progress = 0;
    const interval = setInterval(() => {
      progress += 1;
      updateLoading(progress);
      if (progress >= 100) {
        clearInterval(interval);
        showPlayButton(); // Tampilkan tombol play setelah loading 100%
      }
    }, LOADING_DURATION / 100);
  }

  // --- Fungsi Game ---
  function getRandomPosition() {
    const x = Math.random() * (window.innerWidth - ENEMY_SIZE);
    const y = Math.random() * (window.innerHeight - ENEMY_SIZE);
    return { x, y };
  }

  function initEnemies() {
    enemies = [];
    document.querySelectorAll('.enemy, .special-enemy, .super-special-enemy').forEach(e => e.remove());

    for (let i = 0; i < NUM_NORMAL_ENEMIES; i++) {
      const el = document.createElement('div');
      el.className = 'enemy';
      el.innerText = 'E' + (i + 1);
      gameArea.appendChild(el);
      const pos = getRandomPosition();
      el.style.left = pos.x + 'px';
      el.style.top = pos.y + 'px';
      enemies.push({ element: el, x: pos.x, y: pos.y, alive: true, isSpecial: false, isSuperSpecial: false });
    }

    const specialEl = document.createElement('div');
    specialEl.className = 'special-enemy';
    specialEl.innerText = 'SP';
    gameArea.appendChild(specialEl);
    const specialPos = getRandomPosition();
    specialEl.style.left = specialPos.x + 'px';
    specialEl.style.top = specialPos.y + 'px';
    enemies.push({ element: specialEl, x: specialPos.x, y: specialPos.y, alive: true, isSpecial: true, isSuperSpecial: false });

    const superSpecialEl = document.createElement('div');
    superSpecialEl.className = 'super-special-enemy';
    superSpecialEl.innerText = 'SS';
    gameArea.appendChild(superSpecialEl);
    const superSpecialPos = getRandomPosition();
    superSpecialEl.style.left = superSpecialPos.x + 'px';
    superSpecialEl.style.top = superSpecialPos.y + 'px';
    enemies.push({ element: superSpecialEl, x: superSpecialPos.x, y: superSpecialPos.y, alive: true, isSpecial: false, isSuperSpecial: true });
  }

  function updatePlayerPosition() {
    player.style.left = playerPos.x + 'px';
    player.style.top = playerPos.y + 'px';
  }

  function updatePointsDisplay() {
    pointsDisplay.innerText = 'Points: ' + points;
  }

  function gameLoop() {
    if (keysPressed['w']) playerPos.y -= PLAYER_SPEED;
    if (keysPressed['s']) playerPos.y += PLAYER_SPEED;
    if (keysPressed['a']) playerPos.x -= PLAYER_SPEED;
    if (keysPressed['d']) playerPos.x += PLAYER_SPEED;

    if (playerPos.x < 0) playerPos.x = 0;
    if (playerPos.y < 0) playerPos.y = 0;
    if (playerPos.x > window.innerWidth - ENEMY_SIZE) playerPos.x = window.innerWidth - ENEMY_SIZE;
    if (playerPos.y > window.innerHeight - ENEMY_SIZE) playerPos.y = window.innerHeight - ENEMY_SIZE;

    updatePlayerPosition();
    requestAnimationFrame(gameLoop);
  }

  document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    keysPressed[key] = true;
    if (key === 'f') {
      attack();
    } else if (key === 'p') {
      alert('Poin kamu: ' + points);
    } else if (key === 'r') {
      restartGame();
    }
  });

  document.addEventListener('keyup', (e) => {
    keysPressed[e.key.toLowerCase()] = false;
  });

  function attack() {
    enemies.forEach(e => {
      if (e.alive && isNear(playerPos, e)) {
        e.alive = false;
        e.element.style.display = 'none';

        let pointsGained = 1;
        let message = 'Kamu mengalahkan lawan.';

        if (e.isSuperSpecial) {
          pointsGained = SUPER_SPECIAL_ENEMY_POINTS;
          message = 'Kamu mengalahkan LAWAN SUPER SPESIAL!!!';
        } else if (e.isSpecial) {
          pointsGained = SPECIAL_ENEMY_POINTS;
          message = 'Kamu mengalahkan LAWAN SPESIAL!';
        }

        points += pointsGained;
        localStorage.setItem('points', points);
        updatePointsDisplay();
        status.innerText = message;

        setTimeout(() => {
          const remainingEnemies = enemies.filter(en => en.alive);
          if (remainingEnemies.length > 0) {
            status.innerText = 'Lawan menyerang kamu!';
          } else {
            status.innerText = 'Semua lawan dikalahkan! Tekan R untuk restart.';
          }
        }, 500);
      }
    });
  }

  function isNear(pos1, enemy) {
    const dx = pos1.x - enemy.x;
    const dy = pos1.y - enemy.y;
    return Math.sqrt(dx*dx + dy*dy) < ENEMY_ATTACK_RANGE;
  }

  setInterval(() => {
    enemies.forEach(e => {
      if (e.alive && isNear(playerPos, e)) {
        status.innerText = 'Kamu diserang oleh ' + e.element.innerText;
      }
    });
  }, ENEMY_ATTACK_INTERVAL);

  function restartGame() {
    playerPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
    updatePlayerPosition();
    initEnemies();
    status.innerText = 'Game di-restart!';
  }

  window.addEventListener('resize', () => {
    if (playerPos.x > window.innerWidth - ENEMY_SIZE) playerPos.x = window.innerWidth - ENEMY_SIZE;
    if (playerPos.y > window.innerHeight - ENEMY_SIZE) playerPos.y = window.innerHeight - ENEMY_SIZE;
    updatePlayerPosition();
  });

  // Event listener untuk tombol "Main!!!"
  playButton.addEventListener('click', () => {
    hideLoadingScreen();
    // Inisialisasi game hanya setelah tombol "Main!!!" diklik
    initEnemies();
    updatePlayerPosition();
    updatePointsDisplay();
    requestAnimationFrame(gameLoop); // Mulai game loop
  });

  // Mulai proses loading saat halaman dimuat
  startLoading();
</script>

<script src="./script.js"></script></body></html>
