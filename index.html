<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Game Mobile Legends v4</title><meta name="title" content="Game Mobile Legends v4"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Game Mobile Legends - Link Tambahan</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #222;
    color: #fff;
    margin: 0;
    overflow: hidden;
  }
  #gameArea {
    position: relative;
    width: 100vw;
    height: 100vh;
    background-color: #444;
  }
  .player, .enemy {
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    color: #fff;
  }
  #player {
    background-color: #4CAF50;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  /* Lawan */
  .enemy {
    background-color: #f44336;
  }
  #points {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 20px;
  }
  #status {
    position: absolute;
    top: 40px;
    left: 10px;
    font-size: 18px;
  }

  /* Style untuk tombol menu */
  #menuButton {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 10px 15px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    z-index: 10; /* Pastikan tombol di atas elemen lain */
  }
  #menuButton:hover {
    background-color: #0056b3;
  }

  /* Style untuk dropdown menu */
  #linkDropdown {
    position: absolute;
    top: 50px; /* Sesuaikan jarak dari tombol */
    right: 10px;
    background-color: #333;
    border: 1px solid #555;
    border-radius: 5px;
    display: none; /* Awalnya disembunyikan */
    z-index: 9; /* Di bawah tombol, tapi di atas game */
    min-width: 150px;
  }
  #linkDropdown a {
    color: white;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
    font-size: 14px;
  }
  #linkDropdown a:hover {
    background-color: #555;
  }
</style>



<div id="gameArea">
  <div id="player" class="player">P</div>
</div>
<div id="points">Points: 0</div>
<div id="status">Tekan 'F' untuk serang, 'WASD' untuk bergerak, 'P' lihat poin, 'R' restart</div>

<!-- Tombol Menu -->
<button id="menuButton">Menu</button>

<!-- Dropdown Menu -->
<div id="linkDropdown">
  <a href="https://www.tiktok.com" target="_blank">TikTok</a>
</div>

<script>
const gameArea = document.getElementById('gameArea');
const player = document.getElementById('player');
const pointsDisplay = document.getElementById('points');
const status = document.getElementById('status');
const menuButton = document.getElementById('menuButton');
const linkDropdown = document.getElementById('linkDropdown');

let points = localStorage.getItem('points') ? parseInt(localStorage.getItem('points')) : 0;
let keysPressed = {};

let playerPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
let enemies = [];

const NUM_ENEMIES = 30;
const ENEMY_SIZE = 40;
const PLAYER_SPEED = 3;
const ENEMY_ATTACK_RANGE = 50;
const ENEMY_ATTACK_INTERVAL = 1000;

// Fungsi untuk posisi acak
function getRandomPosition() {
  const x = Math.random() * (window.innerWidth - ENEMY_SIZE);
  const y = Math.random() * (window.innerHeight - ENEMY_SIZE);
  return { x, y };
}

// Inisialisasi lawan
function initEnemies() {
  enemies = [];
  document.querySelectorAll('.enemy').forEach(e => e.remove());
  for (let i = 0; i < NUM_ENEMIES; i++) {
    const el = document.createElement('div');
    el.className = 'enemy';
    el.innerText = 'E' + (i + 1);
    gameArea.appendChild(el);
    const pos = getRandomPosition();
    el.style.left = pos.x + 'px';
    el.style.top = pos.y + 'px';
    enemies.push({ element: el, x: pos.x, y: pos.y, alive: true });
  }
}

// Update posisi pemain di DOM
function updatePlayerPosition() {
  player.style.left = playerPos.x + 'px';
  player.style.top = playerPos.y + 'px';
}

// Inisialisasi game
initEnemies();
updatePlayerPosition();
updatePointsDisplay();

// Update tampilan poin
function updatePointsDisplay() {
  pointsDisplay.innerText = 'Points: ' + points;
}

// Game loop untuk gerakan yang mulus
function gameLoop() {
  if (keysPressed['w']) playerPos.y -= PLAYER_SPEED;
  if (keysPressed['s']) playerPos.y += PLAYER_SPEED;
  if (keysPressed['a']) playerPos.x -= PLAYER_SPEED;
  if (keysPressed['d']) playerPos.x += PLAYER_SPEED;

  // Batasi posisi pemain agar tidak keluar layar
  if (playerPos.x < 0) playerPos.x = 0;
  if (playerPos.y < 0) playerPos.y = 0;
  if (playerPos.x > window.innerWidth - ENEMY_SIZE) playerPos.x = window.innerWidth - ENEMY_SIZE;
  if (playerPos.y > window.innerHeight - ENEMY_SIZE) playerPos.y = window.innerHeight - ENEMY_SIZE;

  updatePlayerPosition();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

// Event listener untuk tombol ditekan
document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  keysPressed[key] = true;
  if (key === 'f') {
    attack();
  } else if (key === 'p') {
    alert('Poin kamu: ' + points);
  } else if (key === 'r') {
    restartGame();
  }
});

// Event listener untuk tombol dilepas
document.addEventListener('keyup', (e) => {
  keysPressed[e.key.toLowerCase()] = false;
});

// Fungsi untuk menyerang lawan
function attack() {
  enemies.forEach(e => {
    if (e.alive && isNear(playerPos, e)) {
      e.alive = false;
      e.element.style.display = 'none';
      points += 1;
      localStorage.setItem('points', points);
      updatePointsDisplay();
      status.innerText = 'Kamu mengalahkan lawan!';
      setTimeout(() => {
        if (enemies.some(en => en.alive)) {
          status.innerText = 'Lawan menyerang kamu!';
        } else {
          status.innerText = 'Semua lawan dikalahkan! Tekan R untuk restart.';
        }
      }, 500);
    }
  });
}

// Cek apakah pemain dekat dengan lawan
function isNear(pos1, enemy) {
  const dx = pos1.x - enemy.x;
  const dy = pos1.y - enemy.y;
  return Math.sqrt(dx*dx + dy*dy) < ENEMY_ATTACK_RANGE;
}

// Interval untuk membuat lawan menyerang secara otomatis
setInterval(() => {
  enemies.forEach(e => {
    if (e.alive && isNear(playerPos, e)) {
      status.innerText = 'Kamu diserang oleh ' + e.element.innerText;
    }
  });
}, ENEMY_ATTACK_INTERVAL);

// Fungsi untuk me-restart game
function restartGame() {
  playerPos = { x: window.innerWidth/2, y: window.innerHeight/2 };
  updatePlayerPosition();
  initEnemies();
  status.innerText = 'Game di-restart!';
}

// Handle resize window
window.addEventListener('resize', () => {
  if (playerPos.x > window.innerWidth - ENEMY_SIZE) playerPos.x = window.innerWidth - ENEMY_SIZE;
  if (playerPos.y > window.innerHeight - ENEMY_SIZE) playerPos.y = window.innerHeight - ENEMY_SIZE;
  updatePlayerPosition();
});

// Event listener untuk tombol menu
menuButton.addEventListener('click', () => {
  // Toggle tampilan dropdown
  if (linkDropdown.style.display === 'block') {
    linkDropdown.style.display = 'none';
  } else {
    linkDropdown.style.display = 'block';
  }
});

// Tutup dropdown jika klik di luar area dropdown atau tombol menu
document.addEventListener('click', (e) => {
  if (!linkDropdown.contains(e.target) && e.target !== menuButton) {
    linkDropdown.style.display = 'none';
  }
});
</script>


<script src="./script.js"></script></body></html>
